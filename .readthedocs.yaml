---
# The documentation is published to https://refenv.github.io/cijoe/ by
# .github/workflows/docs.yml. Read the Docs only serves a page sending visitors
# of https://cijoe.readthedocs.io/ there, deep links included.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  commands:
  - mkdir -p $READTHEDOCS_OUTPUT/html
  - cp docs/rtd-redirect/index.html $READTHEDOCS_OUTPUT/html/index.html
  - cp docs/rtd-redirect/index.html $READTHEDOCS_OUTPUT/html/404.html
