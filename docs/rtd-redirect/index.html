<!DOCTYPE html>
<!--
  Served by Read the Docs as both index.html and 404.html, so every old
  cijoe.readthedocs.io address lands on the same page at GitHub Pages.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>cijoe documentation has moved</title>
  <link rel="canonical" href="https://refenv.github.io/cijoe/">
  <meta http-equiv="refresh" content="3; url=https://refenv.github.io/cijoe/">
  <script>
    // Drop the "/en/<version>/" prefix Read the Docs puts before every page
    var page = window.location.pathname.replace(/^\/[^/]+\/[^/]+\//, "");
    if (page === window.location.pathname) {
      page = "";
    }
    window.location.replace(
      "https://refenv.github.io/cijoe/" + page + window.location.hash
    );
  </script>
</head>
<body>
  <p>
    The cijoe documentation has moved to
    <a href="https://refenv.github.io/cijoe/">https://refenv.github.io/cijoe/</a>.
  </p>
</body>
</html>
