---
doc: |
  This task file is an example of how to use core.put and core.get.

steps:
- name: diskimage_from_cloudimage
  uses: system_imaging.diskimage_from_cloudimage
  with:
    pattern: "debian-13-x86_64"

- name: guest_initialize
  uses: qemu.guest_initialize
  with:
    guest_name: generic-bios-kvm-x86_64
    system_image_name: debian-13-x86_64

- name: guest_start
  uses: qemu.guest_start
  with:
    guest_name: generic-bios-kvm-x86_64

- name: guest_check
  run: |
    hostname

- name: create_file
  target: initiator
  run: |
    echo "Hello World" > /tmp/hello.txt

- name: put
  uses: core.put
  with:
    src: /tmp/hello.txt
    dst: /tmp/hello_from_initiator.txt

- name: get
  uses: core.get
  with:
    src: /tmp/hello_from_initiator.txt
    dst: /tmp/hello_from_target.txt

- name: check
  target: initiator
  run: |
    cat /tmp/hello_from_target.txt

- name: guest_kill
  uses: qemu.guest_kill
  with:
    guest_name: generic-bios-kvm-x86_64
