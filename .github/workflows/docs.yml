---
name: docs

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
    - "main"

defaults:
  run:
    shell: bash

# One deployment at a time, without cancelling a run that is mid-flight
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Grab source
      uses: actions/checkout@v5.0.1

    - name: Set up Python
      uses: actions/setup-python@v6.0.0
      with:
        python-version: '3.12'

    # cijoe from the checkout rather than PyPI, so the docs describe this tree
    - name: Install cijoe and the docs dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install . $(grep -v '^cijoe$' docs/requirements.txt)

    - name: Check that the packages section is up to date
      working-directory: docs
      run: |
        make emit-section-packages PYTHON=python3
        if [[ -n "$(git status --porcelain source/packages)" ]]; then
          git status --short source/packages
          echo "docs/source/packages is stale; run 'make emit-section-packages' in docs/"
          exit 1
        fi

    - name: Build HTML
      working-directory: docs
      run: make build

    - name: Upload HTML
      uses: actions/upload-artifact@v6.0.0
      with:
        name: docs-html
        path: docs/build
        if-no-files-found: error

  deploy:
    # Deploy on pushes to main only; PR and dispatch builds stay artifacts-only
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - uses: actions/download-artifact@v7.0.0
      with:
        name: docs-html
        path: html/

    - uses: actions/configure-pages@v6

    - uses: actions/upload-pages-artifact@v5
      with:
        path: html/

    - id: deployment
      uses: actions/deploy-pages@v5
