---
name: extended

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The release to run on; default, the latest release
        required: false
        default: ""
  pull_request:
    types: [opened, reopened, synchronize, labeled]

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
      github.event.action == 'labeled' && github.event.label.name != 'extended'
      && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'extended') &&
      (github.event.action != 'labeled' || github.event.label.name == 'extended'))
    runs-on: ubuntu-latest
    steps:
    - name: Get the pull request's build, or the release's
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        HEAD: ${{ github.event.pull_request.head.sha }}
        RELEASE: ${{ inputs.ref }}
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          for _ in $(seq 60); do
            run=$(gh run list --repo "$REPO" --workflow verify_and_publish.yml \
              --commit "$HEAD" --limit 1 --json databaseId --jq '.[0].databaseId')
            if [ -n "$run" ] &&
              gh run download "$run" --repo "$REPO" --name dist --dir dist; then
              break
            fi
            sleep 10
          done
        else
          gh release download ${RELEASE:+"$RELEASE"} --repo "$REPO" \
            --pattern 'cijoe-*' --dir dist
        fi
        ls dist/cijoe-*.tar.gz

    - name: Upload the build
      uses: actions/upload-artifact@v6.0.0
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  examples:
    needs: build
    runs-on: ubuntu-22.04

    # This is needed for 'guestmount' / 'libguestfs'
    env:
      LIBGUESTFS_BACKEND: direct

    container:
      image: ghcr.io/refenv/cijoe-docker:latest
      options: >
        --device=/dev/kvm
        --device=/dev/fuse
        --cap-add=SYS_ADMIN
        --security-opt apparmor=unconfined

    strategy:
      fail-fast: false
      matrix:
        usage_example:
        - core.testrunner
        - core.get_put
        - qemu.guest_x86_64
        - qemu.guest_aarch64
        - linux.build_kdebs
        - linux.null_blk
        - qemu.build
        - system_imaging.debian
        python-version: ['3.12']

    steps:
    - name: Grab source
      uses: actions/checkout@v5.0.1
      with:
        ref: ${{ inputs.ref }}
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: tmp install deps
      run: |
        apt-get update -y
        apt-get install libdw-dev -y

    - name: Download the build
      uses: actions/download-artifact@v7.0.0
      with:
        name: dist
        path: dist/

    - name: Install the build
      run: |
        pipx uninstall cijoe
        make deps info install
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    # This is necessary for running pytest, which is invoked in
    # the testrunner example
    - name: Inject pytest
      if: matrix.usage_example == 'core.testrunner'
      run: |
        pipx inject cijoe --force pytest --include-apps

    - name: Emit the example configuration file and workflow
      run: |
        cijoe --example ${{ matrix.usage_example }}

    - name: Rename cijoe-script to match pytest naming conventions
      if: matrix.usage_example == 'core.testrunner'
      run: |
        mv cijoe-example-${{ matrix.usage_example }}/cijoe-script.py \
          cijoe-example-${{ matrix.usage_example }}/test_cijoe-script.py

    - name: Run it!
      run: |
        cijoe --monitor -l \
          --config cijoe-example-${{ matrix.usage_example }}/cijoe-config.toml \
          cijoe-example-${{ matrix.usage_example }}/cijoe-task.yaml

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v6.0.0
      with:
        name: report-cijoe_packages-${{ matrix.usage_example }}
        path: cijoe-output/*
        if-no-files-found: error


  test_config_images:
    needs: build
    runs-on: ubuntu-22.04

    # This is needed for 'guestmount' / 'libguestfs'
    env:
      LIBGUESTFS_BACKEND: direct

    container:
      image: ghcr.io/refenv/cijoe-docker:latest
      options: >
        --device=/dev/kvm
        --device=/dev/fuse
        --cap-add=SYS_ADMIN
        --security-opt apparmor=unconfined

    strategy:
      fail-fast: false
      matrix:
        image:
        - debian-13
        - fedora-44
        - ubuntu-2404
        - freebsd-14
        architecture:
        - x86_64
        include:
        - image: debian-13
          architecture: aarch64

    steps:
    - name: Grab source
      uses: actions/checkout@v5.0.1
      with:
        ref: ${{ inputs.ref }}
    - name: Set up Python
      uses: actions/setup-python@v6.0.0
      with:
        python-version: 3.12

    - name: tmp install deps
      run: |
        apt-get update -y
        apt-get install libdw-dev -y

    - name: Download the build
      uses: actions/download-artifact@v7.0.0
      with:
        name: dist
        path: dist/

    - name: Install the build
      run: |
        pipx uninstall cijoe
        make deps info install
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Get config file
      run: |
        cp \
          $(cijoe -r | grep "system_imaging.example_config_debian" -A 1 | tail -n1 | sed -n -e 's/^.*path: //p') \
          cijoe-config.toml

    - name: Run system_imaging.diskimage_from_cloudimage
      run: |
        $(which cijoe) \
          system_imaging.diskimage_from_cloudimage \
          --monitor -l \
          --config cijoe-config.toml \
          --output report-${{ matrix.image }}-${{ matrix.architecture }}-diskimage_from_cloudimage \
          --pattern ${{ matrix.image }}-${{ matrix.architecture }}

    - name: Run system_imaging.dockerimage_from_diskimage
      if: contains(matrix.image, 'freebsd') == false
      run: |
        $(which cijoe) \
          system_imaging.dockerimage_from_diskimage \
          --monitor -l \
          --config cijoe-config.toml \
          --output report-${{ matrix.image }}-${{ matrix.architecture }}-dockerimage_from_diskimage \
          --pattern ${{ matrix.image }}-${{ matrix.architecture }}

    - name: Archive reports
      if: always()
      run: |
        tar czf report-config_img-${{ matrix.image }}_${{ matrix.architecture }}.tar.gz \
          report-${{ matrix.image }}-${{ matrix.architecture }}-*

    - name: Upload reports
      uses: actions/upload-artifact@v6.0.0
      if: always()
      with:
        name: report-config_img-${{ matrix.image }}_${{ matrix.architecture }}
        path: report-config_img-${{ matrix.image }}_${{ matrix.architecture }}.tar.gz
        if-no-files-found: error

  report:
    needs: [build, examples, test_config_images]
    if: failure() && inputs.ref != ''
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
    - name: Open an issue about the release
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        RELEASE: ${{ inputs.ref }}
        RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        title="$RELEASE: extended failed"
        open=$(gh issue list --repo "$REPO" --state open --search "\"$title\" in:title" \
          --json title --jq "[.[] | select(.title == \"$title\")] | length")
        if [ "$open" != "0" ]; then
          echo "There is an open issue '$title' already"
          exit 0
        fi
        gh issue create --repo "$REPO" --title "$title" \
          --body "The extended workflow failed on $RELEASE, after it was released: $RUN"
