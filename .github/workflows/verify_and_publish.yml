---
name: verify_and_publish

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
    - "docs/**"
    - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  format:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.12']

    steps:
    - name: Grab source
      uses: actions/checkout@v5.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Python dependencies and their versions
      run: |
        make deps
        make info
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install pre-commit
      run: |
        pipx install pre-commit --python ${{ matrix.python-version }}

    - name: Run pre-commit
      run: |
        make format-all

  build:
    runs-on: ubuntu-latest
    steps:
    - name: Grab source
      uses: actions/checkout@v5.0.1
    - name: Set up Python
      uses: actions/setup-python@v6.0.0
      with:
        python-version: '3.12'

    - name: Build tools
      run: |
        make deps
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Build the sdist and wheel
      run: |
        make build

    - name: Upload the build
      uses: actions/upload-artifact@v6.0.0
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  unittest:
    needs: [format, build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        python-version: ['3.10', '3.11', '3.12', '3.13']
        exclude:
        - os: macos-15
          python-version: '3.11'
        - os: macos-15
          python-version: '3.12'

    steps:
    - name: Grab source
      uses: actions/checkout@v5.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Python dependencies and their versions
      run: |
        make deps
        make info
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    # For the guest boot-image test that opens a real qcow2 overlay
    - name: qemu-img
      if: runner.os == 'Linux'
      run: |
        sudo apt-get -qq update
        sudo apt-get -qq install -y qemu-utils

    - name: Download the build
      uses: actions/download-artifact@v7.0.0
      with:
        name: dist
        path: dist/

    - name: Install the build and test it
      run: |
        make uninstall install info test
        cijoe -r

    - name: Upload coverage file
      if: always()
      uses: actions/upload-artifact@v6.0.0
      with:
        name: report-coverage-${{ matrix.python-version }}-${{ matrix.os }}
        path: .coverage
        include-hidden-files: true
        if-no-files-found: error


  examples:
    needs: [format, build]
    runs-on: ubuntu-22.04

    # This is needed for 'guestmount' / 'libguestfs'
    env:
      LIBGUESTFS_BACKEND: direct

    container:
      image: ghcr.io/refenv/cijoe-docker:latest
      options: >
        --device=/dev/kvm
        --device=/dev/fuse
        --cap-add=SYS_ADMIN
        --security-opt apparmor=unconfined

    strategy:
      fail-fast: false
      matrix:
        usage_example:
        - core.default
        - core.facts
        python-version: ['3.12']

    steps:
    - name: Grab source
      uses: actions/checkout@v5.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: tmp install deps
      run: |
        apt-get update -y
        apt-get install libdw-dev -y

    - name: Download the build
      uses: actions/download-artifact@v7.0.0
      with:
        name: dist
        path: dist/

    - name: Install the build
      run: |
        pipx uninstall cijoe
        make deps info install
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    # This is necessary for running pytest, which is invoked in
    # the testrunner example
    - name: Inject pytest
      if: matrix.usage_example == 'core.testrunner'
      run: |
        pipx inject cijoe --force pytest --include-apps

    - name: Emit the example configuration file and workflow
      run: |
        cijoe --example ${{ matrix.usage_example }}

    - name: Rename cijoe-script to match pytest naming conventions
      if: matrix.usage_example == 'core.testrunner'
      run: |
        mv cijoe-example-${{ matrix.usage_example }}/cijoe-script.py \
          cijoe-example-${{ matrix.usage_example }}/test_cijoe-script.py

    - name: Run it!
      run: |
        coverage run \
          $(which cijoe) --monitor -l \
            --config cijoe-example-${{ matrix.usage_example }}/cijoe-config.toml \
            cijoe-example-${{ matrix.usage_example }}/cijoe-task.yaml

    - name: Coverage report
      run: |
        coverage report

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v6.0.0
      with:
        name: report-cijoe_packages-${{ matrix.usage_example }}
        path: cijoe-output/*
        if-no-files-found: error

    - name: Upload coverage files
      if: always()
      uses: actions/upload-artifact@v6.0.0
      with:
        name: report-coverage-${{ matrix.usage_example }}
        path: .coverage
        include-hidden-files: true
        if-no-files-found: error


  test_cli:
    needs: [format, build]
    runs-on: ubuntu-22.04

    # This is needed for 'guestmount' / 'libguestfs'
    env:
      LIBGUESTFS_BACKEND: direct

    container:
      image: ghcr.io/refenv/cijoe-docker:latest
      options: >
        --device=/dev/kvm
        --device=/dev/fuse
        --cap-add=SYS_ADMIN
        --security-opt apparmor=unconfined

    strategy:
      fail-fast: false
      matrix:
        cli:
        - name: "integrity-check"
          cmd: "$(which cijoe) example/cijoe-task.yaml -c example/cijoe-config.toml --integrity-check"
        - name: "script-target"
          cmd: "$(which cijoe) core.example_script_default -c example/cijoe-config.toml"
        - name: "task-steps"
          cmd: "$(which cijoe) example/cijoe-task.yaml -c example/cijoe-config.toml script_with_args"
        - name: "emit-example"
          cmd: "$(which cijoe) --example core.default"
        - name: "archive"
          cmd: "$(which cijoe) --archive"
        python-version: ['3.12']

    steps:
    - name: Grab source
      uses: actions/checkout@v5.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Download the build
      uses: actions/download-artifact@v7.0.0
      with:
        name: dist
        path: dist/

    - name: Install the build
      run: |
        pipx uninstall cijoe
        make deps info install
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Emit the example configuration file and workflow
      run: |
        cijoe --example core.default
        mv ./cijoe-example-core.default ./example

    - name: Create cijoe-output directory
      if: matrix.cli.name == 'archive'
      run: |
        $(which cijoe) core.example_script_default -c example/cijoe-config.toml

    - name: Run it!
      run: |
        coverage run ${{ matrix.cli.cmd }} -l --monitor

    - name: Coverage report
      run: |
        coverage report

    - name: Upload coverage files
      if: always()
      uses: actions/upload-artifact@v6.0.0
      with:
        name: report-coverage-cli-${{ matrix.cli.name }}
        path: .coverage
        include-hidden-files: true
        if-no-files-found: error


  publish-coverage:
    runs-on: ${{ matrix.os }}
    needs: [examples, test_cli, unittest]

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.12']

    steps:
    - name: Grab source
      uses: actions/checkout@v5.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Build and install cijoe from source
      run: |
        pipx uninstall cijoe || true
        make deps info build install
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Download all artifacts
      uses: actions/download-artifact@v7.0.0
      with:
          # If you omit 'name', all artifacts from previous jobs are downloaded.
        path: ./all_artifacts

    - name: Show downloaded artifacts
      run: |
        find all_artifacts -name '.coverage*' -exec coverage debug data {} \;
        coverage combine \
          all_artifacts/report-coverage**/.coverage**
        coverage report

    - name: Coveralls upload
      uses: coverallsapp/github-action@v2
